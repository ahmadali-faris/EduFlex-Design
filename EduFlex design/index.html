<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Link css -->
   <link rel="stylesheet" href="style.css">
  <title>EduFlex</title>
</head>
<body>
  <nav class="nav-bar">
    <h2 class="logo">EduFlex</h2>
    <ul class="nav-links">
      <li class="nav-link"><a href="#">Course</a></li>
      <li class="nav-link"><a href="#">Pricing</a></li>
      <li class="nav-link"><a href="#">Tutor</a></li>
      <li class="nav-link"><a href="#">Admission</a></li>
      <li class="nav-link"><a href="#">About</a></li>
    </ul>
    <button class="contact-btn">Contact</button>
  </nav>

  <main class="container">
    <div class="content-div">
      <div class="text">
        <h1>A new way to learn <br>& get knowledge </h1>
        <p>EduFlex is here for you with various courses & <br>materials from skilled tutors all around the world</p>
        <div class="btns">
          <button class="btn join-btn">Join the Class</button>
          <button class="btn learn-btn">Learn more</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat stat1 stat4">
          <h2>15,2K</h2>
          <p>Active students</p>
        </div>
        <div class="stat stat1 stat3">
          <h2>4,5K</h2>
          <p>Tutors</p>
        </div>
        <div class="stat stat2 stat4">
          <h2>10M</h2>
          <p>Resources</p>
        </div>
      </div>
    </div>
    <div class="image-div">
      <img width="600" height="450" src="./assets/Collage promotionnel pastel avec jeunes adultes.png" alt="Students">
    </div>
  </main>
</body>
</html>
